[package]
name = "hydrogen"
version = "0.1.0"
edition = "2024"
description = "Unified multi-provider LLM client (Anthropic, OpenAI, xAI)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lab9-sh/hydrogen"
keywords = ["llm", "ai", "anthropic", "openai", "xai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "hydrogen"
path = "src/lib.rs"

[dependencies]
bytes = "1"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
